name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils pandoc
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pandoc poppler
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install -y poppler pandoc
      - name: Strict plugin validation (claude CLI), else SKILL.md lint
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate --strict plugins/research-kit
          else
            python3 scripts/lint-skills.py
          fi
      - name: Test and documented Unix smoke
        if: runner.os != 'Windows'
        run: python3 scripts/smoke.py && make check
      - name: Test and documented PowerShell smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/smoke.py; python -m unittest discover -s tests -v
