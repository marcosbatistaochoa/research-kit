name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils pandoc
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pandoc poppler
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y poppler pandoc
          if ($LASTEXITCODE -ne 0) {
            throw "choco install failed with exit code $LASTEXITCODE"
          }
          $dependencyBins = @((Join-Path $env:ChocolateyInstall 'bin'))
          foreach ($tool in 'pandoc.exe', 'pdftotext.exe') {
            $matches = Get-ChildItem (Join-Path $env:ChocolateyInstall 'lib') -Filter $tool -File -Recurse
            if (-not $matches) {
              throw "choco install did not provide $tool"
            }
            $dependencyBins += $matches.DirectoryName
          }
          $dependencyBins | Select-Object -Unique | Add-Content -Path $env:GITHUB_PATH
      - name: Strict plugin validation (claude CLI), else SKILL.md lint
        shell: bash
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate --strict plugins/research-kit
          else
            python scripts/lint-skills.py
          fi
      - name: Documented smoke
        run: python scripts/smoke.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Unix static checks
        if: runner.os != 'Windows'
        run: make check
